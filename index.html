<!doctype html>
<html lang="pt-BR">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caio &amp; Aline</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Cinzel:wght@400;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================================
       ESTILOS GERAIS E ESTRUTURA BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Cormorant Garamond', serif;
    }

    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 1.8s ease-in-out;
      pointer-events: none;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ==========================================================================
       CENA 1: FOTO 1 E REVELAÇÃO DAS CORTINAS LATERAIS
       ========================================================================== */
    #s1 {
      overflow: hidden;
    }

    .s1-img-wrap {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scale(1);
      transition: transform 6s ease-out;
    }

    .s1-img-wrap.zoom-subtle {
      transform: scale(1.02); /* Zoom suave de 2% */
    }

    .s1-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .curtain {
      position: absolute;
      top: 0;
      width: 50.5%;
      height: 100%;
      background: #000;
      z-index: 2;
      transition: transform 2.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .curtain.left { left: 0; }
    .curtain.right { right: 0; }

    .curtain.open-left { transform: translateX(-100%); }
    .curtain.open-right { transform: translateX(100%); }

    .overlay-dark {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 3;
    }

    .txt-c1 {
      position: absolute;
      z-index: 4;
      text-align: center;
      color: #fff;
      padding: 0 20px;
      width: 100%;
      max-width: 600px;
    }

    .txt-c1 h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(56px, 12vw, 80px);
      line-height: 1.1;
      font-weight: 400;
      text-shadow: 0 2px 15px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }

    .txt-c1 h2 {
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 5vw, 28px);
      letter-spacing: clamp(6px, 2vw, 12px);
      margin-top: 25px;
      font-weight: 400;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease-out, transform 1.2s ease-out;
    }

    .txt-c1 .show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       CENA 2: FOTO 2 E EFEITO DE DATA DIGITADA
       ========================================================================== */
    #s2 img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .date-card {
      position: absolute;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 45px;
      border-radius: 20px;
      opacity: 0;
      transform: translateY(0);
      transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease;
      width: 90%;
      max-width: 500px;
    }

    .date-card.show-card {
      opacity: 1;
    }

    .date-card.move-up {
      transform: translateY(-20px);
    }

    #data-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(40px, 10vw, 60px);
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(1);
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    #data-text.pulse {
      transform: scale(1.12);
    }

    #reserve-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(14px, 3.5vw, 16px);
      color: #ffffff;
      letter-spacing: 4px;
      font-weight: 300;
      font-style: italic;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      margin-top: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1s ease-out, transform 1s ease-out;
      text-align: center;
    }

    #reserve-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ==========================================================================
       CENA 3: TELA FINAL (PAPEL TERRACOTA & CONFIRMAÇÃO)
       ========================================================================== */
    #s3 {
      background-color: #F7F2EC;
      background-image: radial-gradient(#e2d9cf 1px, transparent 0);
      background-size: 24px 24px;
      color: #4E3A34;
      flex-direction: column;
      padding: 40px 20px;
      text-align: center;
      overflow-y: auto;
    }

    .foliage-watermark {
      position: absolute;
      top: -20px;
      left: -20px;
      width: clamp(180px, 35vw, 260px);
      height: clamp(180px, 35vw, 260px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
    }

    .s3-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    #s3 h3 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(48px, 10vw, 68px);
      color: #B65E43;
      margin-bottom: 24px;
      font-weight: 400;
      line-height: 1.2;
    }

    .qr-code {
      width: clamp(160px, 40vw, 200px);
      height: clamp(160px, 40vw, 200px);
      border-radius: 16px;
      background: #fff;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(182, 94, 67, 0.12);
      border: 1px solid rgba(182, 94, 67, 0.2);
      margin-bottom: 28px;
    }

    /* Botão WhatsApp */
    .btn-terracota {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #B65E43;
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: clamp(12px, 3vw, 14px);
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(182, 94, 67, 0.3);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease-in-out;
    }

    .btn-terracota svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .btn-terracota::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transition: left 0.75s ease;
    }

    .btn-terracota:hover::before,
    .btn-terracota:active::before {
      left: 100%;
    }

    .btn-terracota:hover,
    .btn-terracota:active {
      transform: translateY(-2px);
      background-color: #a04f37;
      box-shadow: 0 6px 20px rgba(182, 94, 67, 0.4), 0 0 12px rgba(255, 255, 255, 0.3);
    }
  </style>
 </head>
 <body>

  <section id="s1" class="scene">
    <div class="curtain left" id="cLeft"></div>
    <div class="curtain right" id="cRight"></div>
    <div class="s1-img-wrap" id="imgWrap1">
      <img src="siblings_rug_portrait2.jpg" alt="Caio e Aline">
      <div class="overlay-dark"></div>
    </div>
    <div class="txt-c1">
      <h1 id="names">Caio &amp; Aline</h1>
      <h2 id="convidam">CONVIDAM</h2>
    </div>
  </section>

  <section id="s2" class="scene">
    <img src="foto2.jpg" alt="Foto Casal">
    <div class="overlay-dark"></div>
    
    <div class="date-card" id="dateCard">
      <div id="data-text"></div>
      <div id="reserve-text">RESERVE ESTA DATA</div>
    </div>
  </section>

  <section id="s3" class="scene">
    <svg class="foliage-watermark" viewBox="0 0 100 100" fill="#B65E43">
      <path d="M10,10 Q30,60 80,80 Q30,40 10,10 Z" />
      <path d="M10,10 Q50,30 90,20 Q40,30 10,10 Z" />
      <path d="M20,25 Q45,50 70,60" stroke="#B65E43" stroke-width="2" fill="none" />
      <circle cx="70" cy="60" r="3" />
      <circle cx="80" cy="80" r="4" />
      <circle cx="90" cy="20" r="3" />
    </svg>

    <div class="s3-content">
      <h3>Esperamos você!</h3>
      
      <img src="qrcode.png" alt="QR Code para Confirmação" class="qr-code">
      
      <a href="https://wa.me/5514997633443?text=Olá!%20Recebi%20o%20convite%20do%20casamento%20de%20Caio%20e%20Aline,%20gostaria%20de%20confirmar%20minha%20presença%20e%20saber%20mais%20informações❤️" target="_blank" rel="noopener noreferrer" class="btn-terracota">
        <svg viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.572-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
        Confirmar pelo WhatsApp
      </a>
    </div>
  </section>

  <script>
    const delay = ms => new Promise(res => setTimeout(res, ms));

    async function runInvitationSequence() {
      // 1. Tela preta / Silêncio inicial (0.8s)
      await delay(800);

      // Exibe Cena 1
      const s1 = document.getElementById('s1');
      s1.classList.add('active');

      // 2. Cortinas laterais revelam a foto
      document.getElementById('cLeft').classList.add('open-left');
      document.getElementById('cRight').classList.add('open-right');
      
      // Aplicar zoom de 2% ao finalizar abertura das cortinas
      await delay(2800);
      document.getElementById('imgWrap1').classList.add('zoom-subtle');

      // 3. Exibir nomes
      await delay(400);
      document.getElementById('names').classList.add('show');

      // 4. Exibir texto "CONVIDAM"
      await delay(900);
      document.getElementById('convidam').classList.add('show');

      // 5. Encerrar Cena 1 com transição suave (Fade)
      await delay(3500);
      s1.classList.remove('active');

      // 6. Transição para Cena 2
      await delay(1800);
      const s2 = document.getElementById('s2');
      s2.classList.add('active');

      // Manter foto limpa por 2 segundos
      await delay(2000);

      // Exibir card da data
      const dateCard = document.getElementById('dateCard');
      dateCard.classList.add('show-card');

      // 7. Sequência de escrita da data
      const dateSteps = [
        "07",
        "07 •",
        "07 • 08",
        "07 • 08 •",
        "07• 08• 2026"
      ];

      const dataEl = document.getElementById('data-text');
      for (const step of dateSteps) {
        dataEl.innerHTML = step;
        await delay(200);
      }

      // 8. Animação de pulso e respiração da data
      await delay(200);
      dataEl.classList.add('pulse');
      await delay(100);
      dataEl.classList.remove('pulse');

      // 9. Elevação do card e exibição de "RESERVE ESTA DATA"
      await delay(400);
      dateCard.classList.add('move-up');
      document.getElementById('reserve-text').classList.add('show');

      // 10. Permanência da Cena 2 e transição para Tela Final
      await delay(4000);
      s2.classList.remove('active');

      // 11. Exibição da Tela Final
      await delay(1800);
      document.getElementById('s3').classList.add('active');
    }

    // Inicialização da sequência após o carregamento da DOM
    window.addEventListener('DOMContentLoaded', runInvitationSequence);
  </script>
 </body>
</html>
